<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Visual Automation</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="logo">▶ Math Visual</div>
    <div class="header-right">
      <span class="provider-badge" id="providerBadge">Ollama</span>
    </div>
  </header>

  <main>
    <!-- 생성된 영상 목록 -->
    <section class="video-grid" id="videoGrid">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎬</div>
        <p>수학 개념을 입력하면<br>Manim 영상을 자동으로 만들어드립니다</p>
      </div>
    </section>

    <!-- 입력 패널 -->
    <section class="input-panel">
      <div class="input-box">
        <textarea
          id="topicInput"
          placeholder="수학 개념을 입력하세요&#10;예) 이차방정식의 근의 공식, 미분의 기하학적 의미, 피타고라스 정리"
          rows="3"
        ></textarea>
        <button class="generate-btn" id="generateBtn" onclick="generate()">
          <span id="btnText">영상 생성</span>
          <span id="btnIcon">▶</span>
        </button>
      </div>

      <div class="options-row">
        <div class="option-group">
          <label>LLM 프로바이더</label>
          <div class="btn-group">
            <button class="opt-btn active" data-provider="ollama" onclick="setProvider(this)">Ollama (무료)</button>
            <button class="opt-btn" data-provider="gemini" onclick="setProvider(this)">Gemini (무료)</button>
            <button class="opt-btn" data-provider="claude" onclick="setProvider(this)">Claude (유료)</button>
          </div>
        </div>
        <div class="option-group">
          <label>화질</label>
          <div class="btn-group">
            <button class="opt-btn active" data-quality="l" onclick="setQuality(this)">빠름 480p</button>
            <button class="opt-btn" data-quality="m" onclick="setQuality(this)">720p</button>
            <button class="opt-btn" data-quality="h" onclick="setQuality(this)">고화질 1080p</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 진행 토스트 -->
  <div class="toast" id="toast"></div>

  <script src="/static/main.js"></script>
</body>
</html>
